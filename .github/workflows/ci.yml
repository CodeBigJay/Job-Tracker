name: Job Tracker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: job-application-tracker/backend
        run: mvn --batch-mode test
      - name: Package backend
        working-directory: job-application-tracker/backend
        run: mvn --batch-mode package -DskipTests

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: job-application-tracker/frontend
        run: npm install
      - name: Build frontend
        working-directory: job-application-tracker/frontend
        run: npm run build

  containers:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        working-directory: job-application-tracker
        run: docker compose config --quiet
      - name: Build application images
        working-directory: job-application-tracker
        run: docker compose build
