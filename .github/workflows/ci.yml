name: Job Tracker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: job-application-tracker/backend
        run: mvn --batch-mode test
      - name: Package backend
        working-directory: job-application-tracker/backend
        run: mvn --batch-mode package -DskipTests

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: job-application-tracker/frontend
        run: npm install
      - name: Build frontend
        working-directory: job-application-tracker/frontend
        run: npm run build

  containers:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        working-directory: job-application-tracker
        run: docker compose config --quiet
      - name: Build application images
        working-directory: job-application-tracker
        run: docker compose build
      - name: Start application stack
        working-directory: job-application-tracker
        run: docker compose up -d
      - name: Smoke test frontend and authenticated API workflows
        working-directory: job-application-tracker
        env:
          CI_EMAIL: ci-${{ github.run_id }}@example.test
        run: |
          set -euo pipefail
          API="http://localhost:8080"
          FRONTEND="http://localhost:5173"

          for attempt in $(seq 1 60); do
            if curl -fsSL "$API/swagger-ui/index.html" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs backend postgres
              exit 1
            fi
            sleep 3
          done

          curl -fsS "$FRONTEND/" >/dev/null

          token=$(curl -fsS -X POST "$API/api/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"fullName\":\"CI Runner\",\"email\":\"$CI_EMAIL\",\"password\":\"CI-Test-Password-123!\"}" | jq -r '.token')
          test -n "$token"

          app=$(curl -fsS -X POST "$API/api/applications" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"company":"Example Ltd","jobTitle":"Software Engineer","status":"APPLIED"}')
          app_id=$(printf '%s' "$app" | jq -r '.id')
          test -n "$app_id"
          printf '%s' "$app" | jq -e 'has("user") | not' >/dev/null

          note=$(curl -fsS -X POST "$API/api/applications/$app_id/notes" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"content":"Follow up with the recruiter"}')
          note_id=$(printf '%s' "$note" | jq -r '.id')

          interview=$(curl -fsS -X POST "$API/api/applications/$app_id/interviews" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"scheduledAt":"2030-01-15T10:00:00","type":"VIDEO","interviewer":"CI Interviewer"}')
          interview_id=$(printf '%s' "$interview" | jq -r '.id')

          reminder=$(curl -fsS -X POST "$API/api/applications/$app_id/reminders" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"title":"Send a follow-up","remindAt":"2030-01-14T09:00:00"}')
          reminder_id=$(printf '%s' "$reminder" | jq -r '.id')

          curl -fsS "$API/api/applications/$app_id/notes" \
            -H "Authorization: Bearer $token" | jq -e 'length == 1' >/dev/null
          curl -fsS "$API/api/applications/$app_id/interviews" \
            -H "Authorization: Bearer $token" | jq -e 'length == 1' >/dev/null
          curl -fsS "$API/api/applications/$app_id/reminders" \
            -H "Authorization: Bearer $token" | jq -e 'length == 1' >/dev/null

          curl -fsS -X PATCH "$API/api/applications/$app_id/interviews/$interview_id" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"completed":true}' | jq -e '.completed == true' >/dev/null
          curl -fsS -X PATCH "$API/api/applications/$app_id/reminders/$reminder_id" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"completed":true}' | jq -e '.completed == true' >/dev/null

          curl -fsS -X DELETE "$API/api/applications/$app_id/notes/$note_id" \
            -H "Authorization: Bearer $token" >/dev/null
          curl -fsS -X DELETE "$API/api/applications/$app_id/interviews/$interview_id" \
            -H "Authorization: Bearer $token" >/dev/null
          curl -fsS -X DELETE "$API/api/applications/$app_id/reminders/$reminder_id" \
            -H "Authorization: Bearer $token" >/dev/null
          curl -fsS -X DELETE "$API/api/applications/$app_id" \
            -H "Authorization: Bearer $token" >/dev/null
      - name: Stop application stack
        if: always()
        working-directory: job-application-tracker
        run: docker compose down -v
