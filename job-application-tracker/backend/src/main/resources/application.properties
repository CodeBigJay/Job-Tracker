spring.application.name=jobtracker-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
app.jwt.expiration-ms=86400000
springdoc.swagger-ui.path=/swagger-ui.html
